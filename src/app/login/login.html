<!-- Fondo de la pantalla completa, centrado absoluto con Flexbox -->
<div class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
  
  <!-- Tarjeta blanca del formulario con sombra y esquinas redondeadas -->
  <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-200">
    
    <!-- Encabezado -->
    <div class="text-center mb-8">
      <h2 class="text-3xl font-extrabold text-slate-800 tracking-tight">Bienvenido</h2>
      <p class="text-sm text-slate-500 mt-2">Ingresa tus credenciales para acceder</p>
    </div>

    <!-- Formulario -->
    <form (ngSubmit)="onLogin()" class="space-y-6">
      
      <!-- Campo Usuario -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">Email</label>
        <input 
          type="text" 
          [(ngModel)]="email" 
          name="email" 
          required 
          placeholder="Ej. admin"
          class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all text-slate-800"
        >
      </div>

      <!-- Campo Contraseña -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">Contraseña</label>
        <input 
          type="password" 
          [(ngModel)]="password" 
          name="password" 
          required 
          placeholder="••••••••"
          class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all text-slate-800"
        >
      </div>

      <!-- Botón de Acción con efecto Hover (pasar el ratón por encima) -->
      <button 
        type="submit" 
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-lg shadow-md hover:shadow-lg transition-all transform active:scale-[0.98]"
      >
        Iniciar Sesión
      </button>
    </form>

    <!-- Mensaje de Error dinámico -->
    <div *ngIf="errorMessage" class="mt-6 p-3 bg-red-50 border border-red-200 text-red-600 text-sm rounded-lg text-center font-medium animate-pulse">
      {{ errorMessage }}
    </div>

  </div>
</div>
