<div class="min-h-screen bg-slate-50 font-sans">
  <app-header></app-header>

  <main class="max-w-2xl mx-auto mt-12 p-6">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
      
      <!-- Agregamos la referencia de plantilla #tituloTrigger a esta etiqueta -->
      <div #tituloTrigger class="inline-block p-2 bg-indigo-50 border border-indigo-100 rounded-xl mb-6 cursor-help transition-all hover:bg-indigo-100/50 group">
        <h2 class="text-lg font-extrabold text-indigo-700 flex items-center space-x-2">
          <span>❓ Centro de Ayuda y FAQ</span>
          <span class="text-xs font-medium text-indigo-500 group-hover:scale-105 transition-transform">(Pasa el ratón para cargar)</span>
        </h2>
      </div>

      <!-- SISTEMA @DEFER DE ANGULAR -->
      <!-- 'on hover(tituloTrigger)' indica que la descarga inicia al pasar el mouse por encima del título -->
      @defer (on hover(tituloTrigger)) {
        <!-- Este componente se descarga dinámicamente bajo demanda -->
        <app-faq-content></app-faq-content>
      } @placeholder {
        <!-- Lo que ve el usuario antes de pasar el ratón -->
        <div class="p-6 border border-dashed border-slate-300 rounded-xl text-center text-sm text-slate-400 font-medium">
          Mueve el cursor sobre el título superior para inicializar el módulo de ayuda...
        </div>
      } @loading {
        <!-- Mensaje temporal durante los milisegundos que tarda en descargarse el archivo js -->
        <div class="flex items-center justify-center py-4 space-x-2 text-sm text-indigo-600 font-medium">
          <span class="w-4 h-4 border-2 border-indigo-600 border-t-transparent rounded-full animate-spin"></span>
          <span>Descargando fragmento de la aplicación...</span>
        </div>
      }

    </div>
  </main>
</div>
