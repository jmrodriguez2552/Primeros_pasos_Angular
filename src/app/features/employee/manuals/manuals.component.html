<div class="min-h-screen bg-slate-50 p-6 font-sans">
  <div class="max-w-4xl mx-auto bg-white border border-slate-200 p-6 rounded-2xl shadow-sm">
    
    <!-- Cabecera de la tabla -->
    <div class="mb-6 flex items-center justify-between">
      <div>
        <a routerLink="/home" class="text-xs text-indigo-600 hover:underline">← Volver al Portal de Empleado</a>
        <h2 class="text-2xl font-bold text-slate-800 mt-2">Manuales y Documentación Autorizada</h2>
      </div>
    </div>

    <!-- Estructura de la Tabla con Tailwind CSS -->
    <div class="overflow-x-auto rounded-xl border border-slate-200">
      <table class="w-full text-left border-collapse text-sm">
        <thead>
          <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 font-semibold">
            <th class="p-3">Código</th>
            <th class="p-3">Título del Documento</th>
            <th class="p-3">Versión</th>
            <th class="p-3">Departamento</th>
            <th class="p-3 text-center">Acción</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100 text-slate-700">
          <tr *ngFor="let man of listManuals" class="hover:bg-slate-50/80 transition-colors">
            <td class="p-3 font-mono text-xs text-slate-500 font-bold">{{ man.codigo }}</td>
            <td class="p-3 font-medium text-slate-800">{{ man.titulo }}</td>
            <td class="p-3"><span class="bg-slate-100 text-slate-600 text-xs px-2 py-0.5 rounded-md font-medium">{{ man.version }}</span></td>
            <td class="p-3">{{ man.departamento }}</td>
            <td class="p-3 text-center">
              <button class="text-xs font-semibold text-indigo-600 hover:text-indigo-800 hover:underline">Leer PDF</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>
</div>
