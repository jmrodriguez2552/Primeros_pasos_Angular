<div class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
  <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-200">
    <div class="mb-6">
      <a routerLink="/dashboard" class="text-xs text-indigo-600 hover:underline"
        >← Volver al Dashboard</a
      >
      <h2 class="text-2xl font-bold text-slate-800 mt-2">Registrar Nuevo Empleado</h2>
    </div>

    <form (ngSubmit)="onRegister()" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Nombre</label>
        <input
          type="text"
          [(ngModel)]="name"
          name="name"
          required
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
        />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Apellidos</label>
        <input
          type="text"
          [(ngModel)]="surname"
          name="surname"
          required
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
        />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Email Corporativo</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          required
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
        />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Contraseña de Acceso</label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
        />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Rol del Usuario</label>
        <select
          [(ngModel)]="rol"
          name="rol"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
        >
          <option value="empleado">Empleado</option>
          <option value="admin">Administrador</option>
        </select>
      </div>

      <button
        type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg text-sm transition-colors shadow-md"
      >
        Guardar en MongoDB
      </button>
    </form>

    <div
      *ngIf="errorMessage"
      class="mt-4 p-3 bg-red-50 border border-red-200 text-red-600 text-xs rounded-lg text-center font-medium"
    >
      {{ errorMessage }}
    </div>
    <div
      *ngIf="successMessage"
      class="mt-4 p-3 bg-green-50 border border-green-200 text-green-600 text-xs rounded-lg text-center font-medium"
    >
      {{ successMessage }}
    </div>
  </div>
</div>
