<div class="min-h-screen bg-slate-50 font-sans">
  <app-header></app-header>

  <main class="max-w-4xl mx-auto mt-12 p-6">
    <div class="mb-8 flex justify-between items-center">
      <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">Portal de Noticias</h1>
      <button (click)="goToDashboard()" class="text-sm text-indigo-600 font-medium hover:underline">Volver al Panel</button>
    </div>

    <div class="grid gap-6 md:grid-cols-2 lg:grid-cols-3">
      @for (news of articles; track news.id) {
        <div class="bg-white p-6 rounded-2xl shadow-xs border border-slate-200 flex flex-col justify-between">
          <div>
            <h2 class="text-lg font-bold text-slate-900 mb-2">{{ news.title }}</h2>
            <p class="text-slate-500 text-sm leading-relaxed mb-4">{{ news.description }}</p>
          </div>
          <!-- Botón que activa la navegación dinámica -->
          <button 
            (click)="seeDetail(news.id)" 
            class="text-indigo-600 font-semibold text-sm inline-flex items-center hover:text-indigo-800 cursor-pointer"
          >
            <span>Leer más</span>
            <span class="ml-1">→</span>
          </button>
        </div>
      }
    </div>
  </main>
</div>
